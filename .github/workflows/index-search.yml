name: Index site search

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this reindex was requested
        required: false
        default: manual
  push:
    branches:
      - main

concurrency:
  group: index-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  index:
    name: Embed and upsert search documents
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true

      - name: Check required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_SEARCH_DATABASE_URL: ${{ secrets.TURSO_SEARCH_DATABASE_URL }}
          TURSO_SEARCH_AUTH_TOKEN: ${{ secrets.TURSO_SEARCH_AUTH_TOKEN }}
        run: |
          missing=
          for name in GEMINI_API_KEY TURSO_SEARCH_DATABASE_URL TURSO_SEARCH_AUTH_TOKEN; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "These repo Actions secrets are empty:$missing"
            echo "Add them under Settings → Secrets and variables → Actions (repository secrets)."
            exit 1
          fi

      - name: Reindex reason
        run: |
          echo "Reason: ${{ github.event.inputs.reason || github.event_name }}"

      - name: Index search documents
        env:
          APP_ENV: staging
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_SEARCH_DATABASE_URL: ${{ secrets.TURSO_SEARCH_DATABASE_URL }}
          TURSO_SEARCH_AUTH_TOKEN: ${{ secrets.TURSO_SEARCH_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: vp run index:search
