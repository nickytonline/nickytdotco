# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
        versions: [">= 23.a"]
      # TypeScript 7 is the native (Go) compiler port and does not yet expose the
      # programmatic API that @astrojs/language-server / Volar rely on.
      # See: https://github.com/withastro/astro/pull/17345
      # Re-enable once Astro supports TS 7: https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
        versions: [">= 7.a"]
